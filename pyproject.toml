[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "whisperwebdav"
version = "0.1.0"
description = "Daemon that polls a WebDAV share and transcribes audio files using KB-Whisper models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "easytranscriber>=0.3.1",
    "easyaligner",
    "webdavclient3",
    "apprise",
    "pydantic-settings",
    "structlog",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "kokoro-onnx",
    "soundfile",
]

[project.scripts]
whisperwebdav = "whisperwebdav.watcher:main"
whisperwebdav-server = "whisperwebdav.server:main"
whisperwebdav-healthcheck = "whisperwebdav.healthcheck:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "wsgidav>=4.3",
    "cheroot>=10.0",
]

[tool.uv]
package = true
# easytranscriber 0.3.1 caps torch<2.9 / pyannote-audio<4.0.4, but cp314 wheels only exist for newer
# torch. The pins are conservative upstream; the test suite is the check. Drop when upstream relaxes.
override-dependencies = ["torch>=2.7", "torchaudio>=2.7", "pyannote-audio>=3.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: end-to-end tests that require network and real models (deselect with -m 'not integration')",
]
